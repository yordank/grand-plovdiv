@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brick: #d77155; --brick-strong: #e58a70; --brick-ink: #1b0f0b; --brick-soft: #2e1d18;
    --glass: #86b8d8; --glass-soft: #1a2833; --steel: #a8b5c0;
    --bg: #0d151c; --surface: #141f29; --line: #273746; --fg: #e7edf2; --muted: #93a2ae;
    --ok: #6cc391; --bad: #ff8a80; --warn: #f0b960;
    --s-fixed: #6aa2c8; --s-water: #a9d6ef; --s-power: #e9b95e; --s-chillers: #d77155;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brick: #d77155; --brick-strong: #e58a70; --brick-ink: #1b0f0b; --brick-soft: #2e1d18;
  --glass: #86b8d8; --glass-soft: #1a2833; --steel: #a8b5c0;
  --bg: #0d151c; --surface: #141f29; --line: #273746; --fg: #e7edf2; --muted: #93a2ae;
  --ok: #6cc391; --bad: #ff8a80; --warn: #f0b960;
  --s-fixed: #6aa2c8; --s-water: #a9d6ef; --s-power: #e9b95e; --s-chillers: #d77155;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
a { color: var(--glass); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.strong { font-weight: 700; }
.h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.25; }
.h3 { font-family: var(--font-display); font-weight: 500; font-size: 16px; line-height: 1.3; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.brand-mark { font-family: var(--font-display); font-weight: 700; letter-spacing: .08em; }
.brand-mark--brick { color: var(--brick); font-size: 22px; }
:focus-visible { outline: 2px solid var(--glass); outline-offset: 2px; }

/* ---------- boot / message / login ---------- */
.boot, .center-screen { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--muted); padding: 24px 16px; }
.boot .brand-mark { font-size: 28px; color: var(--brick); }
.login {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: linear-gradient(120deg, rgba(10, 22, 32, .88), rgba(10, 22, 32, .45)), var(--hero-img) center 35% / cover no-repeat, #142330;
}
.login__card { width: min(400px, 100%); display: grid; gap: 14px; }
.card--narrow { max-width: 460px; display: grid; gap: 12px; }
.form-error { color: var(--bad); font-weight: 500; font-size: 14px; }

/* ---------- top bar ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--surface); }
.topbar__in { display: flex; align-items: center; gap: 8px 20px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.logo { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--brick); }
.logo .brand-mark { font-size: 20px; }
.logo__sub { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; }
.nav__link { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--fg); font-weight: 500; white-space: nowrap; }
.nav__link:hover { background: var(--glass-soft); }
.nav__link.is-on { background: var(--brick-soft); color: var(--brick-strong); }
.who { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 13px; color: var(--muted); }
@media (max-width: 640px) {
  .nav { order: 3; flex-basis: 100%; }
  .who__name { display: none; }
}

/* ---------- hero ---------- */
.hero {
  color: #fff;
  background: linear-gradient(100deg, rgba(10, 22, 32, .92) 0%, rgba(10, 22, 32, .62) 50%, rgba(10, 22, 32, .12) 100%), var(--hero-img) center 58% / cover no-repeat, #142330;
  border-bottom: 5px solid var(--brick);
}
.hero__in { padding-block: 32px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
.hero__title { font-family: var(--font-display); font-weight: 500; font-size: clamp(24px, 4vw, 38px); line-height: 1.15; margin-top: 6px; }
.hero__lead { margin-top: 8px; opacity: .88; max-width: 60ch; }

/* ---------- page ---------- */
.page { padding-block: 24px 16px; display: grid; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 20px; }
.back { font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 4px; }
.save-state { font-size: 13px; margin-top: 4px; min-height: 1.4em; }
.save-state.is-bad { color: var(--bad); }
.foot { color: var(--muted); font-size: 12px; padding-block: 12px 32px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card--flush { padding: 0; overflow: hidden; }
.card__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.empty { display: grid; gap: 12px; justify-items: start; padding: 28px; }
.link { font-weight: 500; text-decoration: none; }

/* ---------- buttons ---------- */
.btn {
  font: 600 14px var(--font-body); border-radius: 9px; padding: 9px 16px; cursor: pointer;
  border: 1px solid transparent; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; color: var(--fg); background: transparent;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--primary { background: var(--brick); color: var(--brick-ink); }
.btn--primary:hover:not(:disabled) { background: var(--brick-strong); }
.btn--ghost { border-color: var(--line); background: var(--surface); }
.btn--ghost:hover:not(:disabled) { border-color: var(--steel); }
.btn--soft { background: var(--glass-soft); color: var(--fg); }
.btn--soft:hover:not(:disabled) { background: var(--line); }
.btn--danger { background: var(--bad); color: #fff; }
.btn--danger-text { color: var(--bad); }
.btn--sm { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn--lg { min-height: 48px; padding: 12px 22px; font-size: 15px; }
.btn--block { width: 100%; }
.btn.is-busy::after { content: ""; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--glass-soft); color: var(--bad); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.file-btn { cursor: pointer; }

/* ---------- pills, tags ---------- */
.pill { display: inline-flex; align-items: center; font: 600 12px var(--font-body); padding: 3px 10px; border-radius: 999px; white-space: nowrap; letter-spacing: 0; }
.pill--locked { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill--draft { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.pill--muted { background: var(--glass-soft); color: var(--muted); }
.tag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--glass-soft); color: var(--muted); }
.tag--warn { background: transparent; color: var(--brick); border: 1px solid var(--brick); }
.warn-text { color: var(--brick); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); color: inherit; text-decoration: none; min-width: 0; }
.kpi--link:hover { border-color: var(--brick); }
.kpi__label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.kpi__value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi__value.is-warn { color: var(--brick); }
.kpi__sub { font-size: 12px; color: var(--muted); }
.kpis--small .kpi__value { font-size: 20px; }

/* ---------- dashboard ---------- */
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend__item { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw--draft { background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 4px); }
.s-fixed { background: var(--s-fixed); fill: var(--s-fixed); }
.s-water { background: var(--s-water); fill: var(--s-water); }
.s-power { background: var(--s-power); fill: var(--s-power); }
.s-chillers { background: var(--s-chillers); fill: var(--s-chillers); }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 420px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font: 11px var(--font-body); font-variant-numeric: tabular-nums; }
.chart rect.is-draft { opacity: .55; }
.month-list { list-style: none; margin: 0; padding: 0; display: grid; }
.month-list__row { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name sum" "pill sum"; gap: 2px 12px; padding: 10px 4px; border-top: 1px solid var(--line); text-decoration: none; color: inherit; align-items: center; }
.month-list li:first-child .month-list__row { border-top: 0; }
.month-list__row:hover { background: var(--glass-soft); }
.month-list__name { grid-area: name; font-weight: 600; }
.month-list__row .pill { grid-area: pill; justify-self: start; }
.month-list__sum { grid-area: sum; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- month ---------- */
.confirm { background: var(--brick-soft); border: 1px solid var(--brick); border-radius: var(--r); padding: 14px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.confirm p { max-width: 70ch; }
.exports { display: flex; flex-wrap: wrap; gap: 8px; }
.month-grid { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 980px) { .month-grid { grid-template-columns: minmax(0, 1fr); } }
.month-form { display: grid; gap: 22px; }
.month-form fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
.section-title { font-family: var(--font-display); font-weight: 500; font-size: 14px; padding: 0; margin-bottom: 4px; }
.section-title em, .field em, .radio em { display: block; font-style: normal; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.items { display: grid; gap: 6px; justify-items: start; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 112px 32px; gap: 6px; align-items: center; width: 100%; }
@media (max-width: 560px) {
  .item { grid-template-columns: minmax(0, 1fr) 32px; grid-template-areas: "name name" "amount del"; row-gap: 4px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  .item__name { grid-area: name; }
  .item__amount { grid-area: amount; }
  .item .icon-btn { grid-area: del; }
  .field--amount { grid-template-columns: minmax(0, 1fr) 120px; }
}
.subtotal { text-align: right; font-size: 13.5px; color: var(--muted); }
.subtotal strong { color: var(--fg); font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 5px; font-size: 13.5px; font-weight: 500; }
.field--amount { grid-template-columns: minmax(0, 1fr) 130px; align-items: center; }
.field--inline { grid-template-columns: auto minmax(0, 240px); align-items: center; gap: 10px; margin-bottom: 12px; }
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]), select, textarea {
  width: 100%; font: 500 15px var(--font-body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 40px;
}
textarea { resize: vertical; min-height: 70px; }
input:disabled, select:disabled, textarea:disabled { opacity: .8; background: transparent; }
.num-input { text-align: right; font-variant-numeric: tabular-nums; }
.radios { display: grid; gap: 6px; }
.radio, .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.radio input, .check input { margin-top: 3px; accent-color: var(--brick); width: 16px; height: 16px; }
.deduct-extra { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--glass-soft); }

.results { display: grid; gap: 14px; min-width: 0; }
.alert { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); color: var(--fg); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.pools { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.pool { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 3px; min-width: 0; }
.pool__name { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.pool__sum { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pool__base { font-size: 12px; color: var(--muted); }
.pool--total { background: var(--steel); border-color: var(--steel); color: var(--surface); }
.pool--total .pool__name, .pool--total .pool__base { color: color-mix(in srgb, var(--surface) 80%, transparent); }

.tablebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.search { flex: 1 1 220px; max-width: 320px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
.chip:hover { border-color: var(--steel); }
.chip.is-on { background: var(--brick); border-color: var(--brick); color: var(--brick-ink); }

.table-wrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-height: 68vh; }
.card--flush .table-wrap { border: 0; border-radius: 0; max-height: none; }
.table-wrap--tall { max-height: 72vh; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 640px; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; white-space: nowrap; }
.tbl thead th { position: sticky; top: 0; z-index: 1; background: var(--glass-soft); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tbl tbody tr { border-top: 1px solid var(--line); }
.tbl tbody tr[data-row], .tbl--click tbody tr { cursor: pointer; }
.tbl tbody tr[data-row]:hover, .tbl--click tbody tr:hover { background: var(--glass-soft); }
.tbl tbody tr.is-zero { color: var(--muted); }
.tbl .num { text-align: right; }
.tbl .center { text-align: center; }
.tbl tfoot td { position: sticky; bottom: 0; background: var(--surface); border-top: 2px solid var(--fg); font-weight: 700; }
.tbl a { color: inherit; font-weight: 600; text-decoration: none; }
.is-up { color: var(--bad); }
.is-down { color: var(--ok); }
.tbl--edit td { padding: 4px 6px; }
.tbl--edit input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--brick); }
.cell { min-height: 34px !important; padding: 5px 8px !important; font-size: 14px !important; background: transparent !important; border-color: transparent !important; }
.cell:hover:not(:disabled), .cell:focus { border-color: var(--line) !important; background: var(--bg) !important; }
.cell--id { width: 150px !important; font-weight: 600 !important; }
.cell--num { width: 96px !important; }
.cell--floor { width: 56px !important; text-align: right; }
.cell--note { min-width: 180px; }
.cell--note.has-note { color: var(--brick); }
.add-row { justify-self: start; }
.import { border-color: var(--glass); }
.import__list { margin: 8px 0; padding-left: 20px; display: grid; gap: 4px; }

/* ---------- sheet (dialog) ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 30; background: rgba(8, 14, 20, .55); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet__card { width: min(480px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border-radius: 14px; border-top: 6px solid var(--brick); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.sheet__body { padding: 22px; display: grid; gap: 12px; }
.slip__lines { margin: 4px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 9px 16px; font-variant-numeric: tabular-nums; }
.slip__lines dt { color: var(--muted); }
.slip__lines dd { margin: 0; text-align: right; font-weight: 600; }
.slip__due { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--fg); padding-top: 12px; }
.slip__due strong { font-size: 26px; color: var(--brick); font-variant-numeric: tabular-nums; }

/* ---------- toast ---------- */
.toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  max-width: min(560px, calc(100% - 32px)); background: var(--fg); color: var(--bg);
  padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
}
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }

@media (prefers-reduced-motion: no-preference) {
  .sheet__card { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(10px); opacity: .6; } }
}
@media (prefers-reduced-motion: reduce) {
  .btn.is-busy::after { animation: none; }
}

.demo-note { margin-top: 14px; padding: 9px 14px; border-radius: 10px; font-size: 13px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }

</style>
</head>

<script>
// Формати за числа, суми и месеци (български)
(function (root) {
  const MONTHS = ['януари', 'февруари', 'март', 'април', 'май', 'юни', 'юли', 'август', 'септември', 'октомври', 'ноември', 'декември'];

  // 1234567.8 → "1 234 567,80" (обикновен интервал, за да го има във всеки шрифт)
  function n2(v, dec = 2, sep = ' ') {
    const x = Number(v) || 0;
    const neg = x < 0;
    const s = Math.abs(x).toFixed(dec);
    const [i, d] = s.split('.');
    const grouped = i.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
    return (neg && Number(s) !== 0 ? '−' : '') + grouped + (d ? ',' + d : '');
  }

  const F = {
    MONTHS,
    n2,
    eur: (v) => n2(v) + ' €',
    eurPdf: (v) => n2(v, 2, ' ') + ' €',
    pct: (v) => n2(v, 3),
    dash: (v) => (Math.abs(Number(v) || 0) < 0.005 ? '–' : n2(v)),
    monthName(id) {
      if (!id) return '';
      const [y, m] = id.split('-');
      return `${MONTHS[Number(m) - 1]} ${y}`;
    },
    monthTitle(id) {
      const s = F.monthName(id);
      return s.charAt(0).toUpperCase() + s.slice(1);
    },
    nextMonth(id) {
      let [y, m] = id.split('-').map(Number);
      m += 1;
      if (m > 12) { m = 1; y += 1; }
      return `${y}-${String(m).padStart(2, '0')}`;
    },
    prevMonth(id) {
      let [y, m] = id.split('-').map(Number);
      m -= 1;
      if (m < 1) { m = 12; y -= 1; }
      return `${y}-${String(m).padStart(2, '0')}`;
    },
    // Безопасен текст в HTML
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
    // Име на файл без странни знаци
    file: (s) => String(s).replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_'),
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = F;
  else root.GrandFmt = F;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// Разпределение на месечните разходи по Методиката на ТАЦ „Гранд“
// (Приложение № 8 към Протокол от ОС на ЕС от 06.10.2026 г.).
// Един и същ файл работи в браузъра и в Node.js.
(function (root) {
  const PARTS = ['fixed', 'water', 'power', 'chillers'];

  const num = (v) => {
    const x = typeof v === 'string' ? Number(v.replace(/\s/g, '').replace(',', '.')) : Number(v);
    return Number.isFinite(x) ? x : 0;
  };
  const cents = (x) => Math.round(x * 100);
  const sumItems = (items) => (items || []).reduce((s, it) => s + num(it && it.amount), 0);

  // Месец → вход за изчислението
  function monthInput(m) {
    m = m || {};
    let deductPct = 100;
    if (m.deductMode === 'none') deductPct = 0;
    else if (m.deductMode === 'partial') deductPct = Math.min(Math.max(num(m.deductPct), 0), 100);
    return {
      fixed: sumItems(m.fixedItems),
      water: num(m.water),
      power: num(m.power),
      chillers: num(m.chillers),
      revenue: sumItems(m.revenueItems),
      deductPct,
    };
  }

  // Разпределя сума в центове по тегла; остатъкът от закръглянето отива
  // към обектите с най-голяма дробна част, за да е сборът точно равен.
  function allocate(totalCents, weights) {
    const W = weights.reduce((s, w) => s + w, 0);
    const out = weights.map(() => 0);
    if (!W || !totalCents) return out;
    const sign = totalCents < 0 ? -1 : 1;
    const T = Math.abs(totalCents);
    const raw = weights.map((w) => (T * w) / W);
    let used = 0;
    raw.forEach((r, i) => { out[i] = Math.floor(r + 1e-9); used += out[i]; });
    const order = raw
      .map((r, i) => ({ i, frac: r - out[i] }))
      .filter((x) => weights[x.i] > 0)
      .sort((a, b) => b.frac - a.frac || a.i - b.i);
    for (let k = 0; used < T && order.length; k = (k + 1) % order.length) {
      out[order[k].i] += 1;
      used += 1;
    }
    return out.map((c) => sign * c);
  }

  /**
   * objects: [{ id, share, kind, floor, fixed, water, power, chillers, note }]
   * input:   { fixed, water, power, chillers, revenue, deductPct }
   * Допускане: приспаднатите приходи намаляват перо „постоянни разходи“.
   * Връща суми в евро, закръглени до цент; сборът по всяко перо е точен.
   */
  function calculate(objects, input) {
    input = input || {};
    const deducted = cents(num(input.revenue) * Math.min(Math.max(num(input.deductPct), 0), 100) / 100) / 100;
    const pools = {
      fixed: cents(num(input.fixed) - deducted) / 100,
      water: cents(num(input.water)) / 100,
      power: cents(num(input.power)) / 100,
      chillers: cents(num(input.chillers)) / 100,
    };
    const weights = {
      fixed: objects.map((o) => (o.fixed ? 1 : 0)),
      water: objects.map((o) => (o.water ? 1 : 0)),
      power: objects.map((o) => (o.power ? num(o.share) : 0)),
      chillers: objects.map((o) => (o.chillers ? num(o.share) : 0)),
    };
    const bases = {
      fixed: weights.fixed.reduce((s, w) => s + w, 0),
      water: weights.water.reduce((s, w) => s + w, 0),
      power: Math.round(weights.power.reduce((s, w) => s + w, 0) * 1e6) / 1e6,
      chillers: Math.round(weights.chillers.reduce((s, w) => s + w, 0) * 1e6) / 1e6,
    };
    const alloc = {};
    PARTS.forEach((p) => { alloc[p] = allocate(cents(pools[p]), weights[p]); });

    const rows = objects.map((o, i) => {
      const parts = {};
      let t = 0;
      PARTS.forEach((p) => { parts[p] = alloc[p][i] / 100; t += alloc[p][i]; });
      return {
        id: o.id, share: num(o.share), kind: o.kind, floor: o.floor,
        fixed: !!o.fixed, water: !!o.water, power: !!o.power, chillers: !!o.chillers,
        note: o.note || '', parts, total: t / 100,
      };
    });

    const warnings = [];
    PARTS.forEach((p) => {
      if (pools[p] && !bases[p]) warnings.push(`Няма участващи обекти в перо „${LABELS[p]}“ — сумата не е разпределена.`);
    });
    if (pools.fixed < 0) warnings.push('Приспаднатите приходи са по-големи от постоянните разходи.');

    const totalPool = cents(pools.fixed + pools.water + pools.power + pools.chillers) / 100;
    const distributed = rows.reduce((s, r) => s + cents(r.total), 0) / 100;
    return {
      input: { ...input },
      deducted, pools, bases, rows, totalPool, distributed,
      payers: rows.filter((r) => r.total !== 0).length,
      balanced: Math.abs(totalPool - distributed) < 0.005 && warnings.length === 0,
      warnings,
    };
  }

  const LABELS = {
    fixed: 'Постоянни текущи разходи',
    water: 'Вода за общите части',
    power: 'Електроенергия за общите части',
    chillers: 'Електроенергия за чилърите',
  };

  // Какво се пази при заключване: обектите и сметките, за да не се променя историята
  function snapshotOf(objects, result) {
    return {
      objects: objects.map((o) => ({ ...o })),
      pools: result.pools, bases: result.bases, deducted: result.deducted,
      totalPool: result.totalPool, payers: result.payers,
      rows: result.rows.map((r) => ({ id: r.id, share: r.share, parts: r.parts, total: r.total })),
    };
  }

  // Обратно: снимка → резултат във вида на calculate()
  function fromSnapshot(s) {
    const byId = {};
    (s.objects || []).forEach((o) => { byId[o.id] = o; });
    const rows = s.rows.map((r) => {
      const o = byId[r.id] || {};
      return {
        id: r.id, share: r.share, kind: o.kind, floor: o.floor,
        fixed: !!o.fixed, water: !!o.water, power: !!o.power, chillers: !!o.chillers,
        note: o.note || '', parts: r.parts, total: r.total,
      };
    });
    return {
      deducted: s.deducted, pools: s.pools, bases: s.bases, rows,
      totalPool: s.totalPool, distributed: s.totalPool, payers: s.payers,
      balanced: true, warnings: [], locked: true,
    };
  }

  const api = { calculate, monthInput, allocate, sumItems, num, snapshotOf, fromSnapshot, PARTS, LABELS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.GrandCalc = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

// Външни библиотеки се зареждат само когато са нужни (PDF, ZIP, Excel)
(function () {
  const CDN = {
    jspdf: { url: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', ready: () => window.jspdf && window.jspdf.jsPDF },
    jszip: { url: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', ready: () => window.JSZip },
    xlsx: { url: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', ready: () => window.XLSX },
    fonts: { url: '/vendor/onest-fonts.js', ready: () => window.GRAND_FONTS },
  };
  const pending = {};

  function load(name) {
    const lib = CDN[name];
    if (lib.ready()) return Promise.resolve();
    if (pending[name]) return pending[name];
    pending[name] = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = lib.url;
      s.async = true;
      s.onload = () => (lib.ready() ? resolve() : reject(new Error('Библиотеката не се зареди: ' + name)));
      s.onerror = () => { delete pending[name]; reject(new Error('Няма връзка за зареждане на ' + name + '. Провери интернета.')); };
      document.head.appendChild(s);
    });
    return pending[name];
  }

  window.GrandLibs = { load: (...names) => Promise.all(names.map(load)) };
})();

</script>
<script>
// Демо без сървър (GitHub Pages): данните се пазят само в този браузър
(function () {
  const C = window.GrandCalc;
  const KEY = 'grand-demo-v1';
  const MONTH_RE = /^\d{4}-(0[1-9]|1[0-2])$/;
  let mem = null;

  const clone = (x) => JSON.parse(JSON.stringify(x));
  function load() {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { mem = null; }
    if (!mem) mem = { objects: clone(window.GRAND_OBJECTS || []), months: {} };
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch { /* само в паметта */ } }
  function fail(msg, status) { const e = new Error(msg); e.status = status; throw e; }
  const check = (id) => { if (!MONTH_RE.test(id)) fail('Месецът трябва да е във вид ГГГГ-ММ.', 400); };
  const items = (arr) => (Array.isArray(arr) ? arr : [])
    .map((it) => ({ name: String(it && it.name || '').slice(0, 200), amount: Number(it && it.amount) || 0 }))
    .filter((it) => it.name || it.amount);
  function clean(m) {
    const mode = ['full', 'partial', 'none'].includes(m.deductMode) ? m.deductMode : 'full';
    return {
      fixedItems: items(m.fixedItems), water: Number(m.water) || 0, power: Number(m.power) || 0,
      chillers: Number(m.chillers) || 0, revenueItems: items(m.revenueItems), deductMode: mode,
      deductPct: mode === 'partial' ? Math.min(Math.max(Number(m.deductPct) || 0, 0), 100) : mode === 'full' ? 100 : 0,
      deductReason: String(m.deductReason || '').slice(0, 100), note: String(m.note || '').slice(0, 2000),
    };
  }

  window.GrandStore = {
    mode: 'local',
    async init() { load(); return { signedIn: true, canEdit: true, user: 'Демо' }; },
    async getObjects() { return clone(load().objects); },
    async saveObjects(list) { load().objects = clone(list); save(); return clone(list); },
    async listMonths() { return Object.values(load().months).map(clone).sort((a, b) => b.id.localeCompare(a.id)); },
    async getMonth(id) { check(id); const m = load().months[id]; return m ? clone(m) : null; },
    async saveMonth(id, data) {
      check(id);
      const cur = load().months[id];
      if (cur && cur.status === 'locked') fail('Месецът е заключен. Отключи го, за да го промениш.', 409);
      const doc = { ...clean(data), id, status: 'draft', snapshot: null, updatedAt: new Date().toISOString(), lockedAt: null };
      mem.months[id] = doc; save(); return clone(doc);
    },
    async lockMonth(id, objects) {
      check(id);
      const cur = load().months[id];
      if (!cur) fail('Няма такъв месец.', 404);
      if (cur.status === 'locked') fail('Месецът вече е заключен.', 409);
      const result = C.calculate(objects, C.monthInput(cur));
      if (!result.balanced) fail('Сметките не се връзват: ' + (result.warnings.join(' ') || 'сборът не съвпада.'), 422);
      const now = new Date().toISOString();
      const doc = { ...clean(cur), id, status: 'locked', snapshot: C.snapshotOf(objects, result), updatedAt: now, lockedAt: now };
      mem.months[id] = doc; save(); return clone(doc);
    },
    async unlockMonth(id) {
      check(id);
      const cur = load().months[id];
      if (!cur) fail('Няма такъв месец.', 404);
      const doc = { ...clean(cur), id, status: 'draft', snapshot: null, updatedAt: new Date().toISOString(), lockedAt: null };
      mem.months[id] = doc; save(); return clone(doc);
    },
    async deleteMonth(id) {
      check(id);
      const cur = load().months[id];
      if (cur && cur.status === 'locked') fail('Само чернова може да се изтрие.', 409);
      delete mem.months[id]; save(); return { ok: true };
    },
    async download(filename, blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      return true;
    },
  };
})();

</script>
<script>
// PDF: бележка за обект, всички бележки, справка по чл. 11
(function () {
  const F = window.GrandFmt;
  const C = window.GrandCalc;
  const BRICK = [165, 69, 43];
  const INK = [22, 33, 43];
  const MUTED = [93, 107, 119];
  const LINE = [215, 222, 228];
  const ADDRESS = 'Търговски административен център · гр. Пловдив, ул. „Капитан Райчо“ № 56';
  const METHOD = 'Разпределено по Методиката за разпределение на месечните разходи, Приложение № 8 към Протокол от ОС на ЕС – ТАЦ „Гранд“ от 06.10.2026 г.';
  const DEDUCT = {
    full: 'Приспаднати изцяло (чл. 10, ал. 1)',
    partial: 'Приспаднати частично (чл. 10, ал. 2)',
    none: 'Не са приспаднати (чл. 10, ал. 2)',
  };

  async function ready() {
    await window.GrandLibs.load('jspdf', 'fonts');
  }

  function newDoc(format) {
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format, compress: true });
    doc.addFileToVFS('Onest-Regular.ttf', window.GRAND_FONTS.regular);
    doc.addFileToVFS('Onest-Bold.ttf', window.GRAND_FONTS.bold);
    doc.addFont('Onest-Regular.ttf', 'Onest', 'normal');
    doc.addFont('Onest-Bold.ttf', 'Onest', 'bold');
    doc.setFont('Onest', 'normal');
    doc.setLineHeightFactor(1.25);
    return doc;
  }

  const set = (doc, size, style = 'normal', color = INK) => {
    doc.setFont('Onest', style);
    doc.setFontSize(size);
    doc.setTextColor(...color);
  };
  const hr = (doc, x1, y, x2, color = LINE, w = 0.3) => {
    doc.setDrawColor(...color);
    doc.setLineWidth(w);
    doc.line(x1, y, x2, y);
  };

  function brand(doc, x, y, right, subtitle) {
    set(doc, 18, 'bold', BRICK);
    doc.text('GRAND', x, y, { charSpace: 1.2 });
    set(doc, 7.5, 'normal', MUTED);
    doc.text(ADDRESS, x, y + 5);
    if (subtitle) {
      set(doc, 9, 'bold', INK);
      doc.text(subtitle, right, y, { align: 'right' });
    }
    hr(doc, x, y + 8, right, BRICK, 0.8);
    return y + 8;
  }

  function basisText(part, ctx) {
    const b = ctx.result.bases;
    if (part === 'fixed') return `поравно между ${b.fixed} обекта`;
    if (part === 'water') return `поравно между ${b.water} обекта`;
    if (part === 'power') return `по идеални части, база ${F.pct(b.power)}%`;
    return `по идеални части, база ${F.pct(b.chillers)}% (етажи 1–3)`;
  }

  const SLIP_LABEL = {
    fixed: 'Равен дял от постоянните разходи',
    water: 'Равен дял от водата за общите части',
    power: 'Дял от електроенергията за общите части',
    chillers: 'Дял от електроенергията за чилърите',
  };

  // Една бележка на текущата страница (A5)
  function drawSlip(doc, ctx, row) {
    const W = doc.internal.pageSize.getWidth();
    const L = 14, R = W - 14;
    let y = brand(doc, L, 18, R, 'МЕСЕЧНА БЕЛЕЖКА');

    y += 10;
    set(doc, 9, 'normal', MUTED);
    doc.text(`Отчетен период: ${F.monthName(ctx.monthId)}`, L, y);
    y += 8;
    set(doc, 17, 'bold', INK);
    doc.text(`Обект ${row.id}`, L, y);
    set(doc, 9, 'normal', MUTED);
    doc.text(`Идеална част ${F.pct(row.share)}%`, R, y, { align: 'right' });

    y += 9;
    hr(doc, L, y, R);
    for (const p of C.PARTS) {
      y += 7;
      const on = row[p];
      set(doc, 10, 'normal', INK);
      doc.text(SLIP_LABEL[p], L, y);
      set(doc, 10, on ? 'bold' : 'normal', on ? INK : MUTED);
      doc.text(on ? F.eurPdf(row.parts[p]) : 'не участва', R, y, { align: 'right' });
      y += 4.2;
      set(doc, 7.5, 'normal', MUTED);
      doc.text(on ? basisText(p, ctx) : 'обектът не участва в това перо', L, y);
      y += 3;
      hr(doc, L, y, R);
    }

    y += 5;
    doc.setFillColor(243, 236, 233);
    doc.roundedRect(L, y, R - L, 16, 2, 2, 'F');
    set(doc, 10, 'bold', INK);
    doc.text('ЗА ПЛАЩАНЕ', L + 5, y + 10);
    set(doc, 17, 'bold', BRICK);
    doc.text(F.eurPdf(row.total), R - 5, y + 10.5, { align: 'right' });

    y += 26;
    set(doc, 8.5, 'bold', INK);
    doc.text('Общи суми за месеца (чл. 11)', L, y);
    const r = ctx.result;
    const lines = [
      ['Постоянни текущи разходи', C.sumItems(ctx.month.fixedItems)],
      ['Приходи от общите части', C.sumItems(ctx.month.revenueItems)],
      ['  от тях приспаднати', r.deducted],
      ['Вода за общите части', r.pools.water],
      ['Ток за общите части', r.pools.power],
      ['Ток за чилърите', r.pools.chillers],
      ['Общо за разпределяне', r.totalPool],
    ];
    set(doc, 8, 'normal', MUTED);
    for (const [label, v] of lines) {
      y += 4.4;
      doc.text(label, L, y);
      doc.text(F.eurPdf(v), R, y, { align: 'right' });
    }
    if (row.note) {
      y += 7;
      set(doc, 7.5, 'normal', BRICK);
      doc.text(doc.splitTextToSize('Бележка: ' + row.note, R - L), L, y);
    }

    const H = doc.internal.pageSize.getHeight();
    set(doc, 6.8, 'normal', MUTED);
    doc.text(doc.splitTextToSize(METHOD, R - L), L, H - 14);
    doc.text(`Всички суми са в евро. Изготвено: ${new Date().toLocaleDateString('bg-BG')}`, L, H - 7.5);
  }

  async function slip(ctx, row) {
    await ready();
    const doc = newDoc('a5');
    drawSlip(doc, ctx, row);
    return doc.output('blob');
  }

  // Всички бележки в един файл, по една на страница (за печат)
  async function allSlips(ctx) {
    await ready();
    const rows = ctx.result.rows.filter((r) => r.total !== 0);
    const doc = newDoc('a5');
    rows.forEach((row, i) => {
      if (i) doc.addPage('a5');
      drawSlip(doc, ctx, row);
    });
    return doc.output('blob');
  }

  // ZIP с отделен PDF за всеки обект (за изпращане по имейл)
  async function zip(ctx, onProgress) {
    await ready();
    await window.GrandLibs.load('jszip');
    const z = new window.JSZip();
    const rows = ctx.result.rows.filter((r) => r.total !== 0);
    for (let i = 0; i < rows.length; i++) {
      const doc = newDoc('a5');
      drawSlip(doc, ctx, rows[i]);
      z.file(`Belezhka_${ctx.monthId}_${F.file(rows[i].id)}.pdf`, doc.output('arraybuffer'));
      if (onProgress && i % 10 === 0) { onProgress(i, rows.length); await new Promise((r) => setTimeout(r, 0)); }
    }
    return z.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
  }

  // Справка по чл. 11 (A4)
  async function report(ctx) {
    await ready();
    const doc = newDoc('a4');
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
    const L = 16, R = W - 16;
    const r = ctx.result, m = ctx.month;
    let y = brand(doc, L, 18, R, ctx.locked ? 'ЗАКЛЮЧЕН МЕСЕЦ' : 'ЧЕРНОВА');

    const need = (h) => { if (y + h > H - 18) { doc.addPage('a4'); y = 20; return true; } return false; };
    const section = (t) => { need(14); y += 10; set(doc, 11, 'bold', INK); doc.text(t, L, y); y += 2; hr(doc, L, y, R); };
    const line = (label, v, bold, color) => {
      need(6); y += 5.6;
      set(doc, 9.5, bold ? 'bold' : 'normal', color || INK);
      doc.text(label, L, y);
      doc.text(typeof v === 'string' ? v : F.eurPdf(v), R, y, { align: 'right' });
    };

    y += 11;
    set(doc, 15, 'bold', INK);
    doc.text(`Справка за ${F.monthName(ctx.monthId)}`, L, y);
    y += 6;
    set(doc, 9, 'normal', MUTED);
    doc.text('Разходи за управление и поддръжка на общите части и приходи от тях (чл. 11 от Методиката)', L, y);

    section('1. Извършени разходи по видове');
    const fixedItems = (m.fixedItems || []).filter((it) => Number(it.amount));
    fixedItems.forEach((it) => line('   ' + (it.name || 'Без име'), Number(it.amount)));
    line('Постоянни текущи разходи — общо', C.sumItems(m.fixedItems), true);
    line('Вода (ВиК) за общите части', Number(m.water) || 0, true);
    line('Електроенергия за общите части', Number(m.power) || 0, true);
    line('Електроенергия за ОВК системата (чилъри)', Number(m.chillers) || 0, true);
    y += 1.5; hr(doc, L, y, R, INK, 0.5);
    line('Разходи общо', C.sumItems(m.fixedItems) + (Number(m.water) || 0) + (Number(m.power) || 0) + (Number(m.chillers) || 0), true);

    section('2. Постъпили общи приходи и третиране по чл. 10');
    const revItems = (m.revenueItems || []).filter((it) => Number(it.amount));
    if (!revItems.length) line('Няма постъпили приходи', '');
    revItems.forEach((it) => line('   ' + (it.name || 'Без име'), Number(it.amount)));
    line('Приходи общо', C.sumItems(m.revenueItems), true);
    line(DEDUCT[m.deductMode || 'full'] + (m.deductMode === 'partial' ? ` — ${F.n2(m.deductPct, 0)}%` : ''), r.deducted, true, BRICK);
    if (m.deductReason && m.deductMode !== 'full') line('   Основание: ' + m.deductReason, '');
    line('Приспаднатите приходи намаляват постоянните разходи', '', false, MUTED);

    section('3. Разпределение между обектите');
    const cols3 = [L, L + 72, L + 112, R];
    need(8); y += 6;
    set(doc, 8, 'bold', MUTED);
    doc.text('Перо', cols3[0], y); doc.text('Как се дели', cols3[1], y);
    doc.text('База', cols3[2], y); doc.text('Сума', cols3[3], y, { align: 'right' });
    const how = { fixed: 'поравно (чл. 5)', water: 'поравно (чл. 6)', power: 'по ид. части (чл. 7)', chillers: 'по ид. части (чл. 8)' };
    const base = { fixed: `${r.bases.fixed} обекта`, water: `${r.bases.water} обекта`, power: `${F.pct(r.bases.power)}%`, chillers: `${F.pct(r.bases.chillers)}%` };
    for (const p of C.PARTS) {
      need(6); y += 5.6;
      set(doc, 9.5, 'normal', INK);
      doc.text(C.LABELS[p], cols3[0], y);
      set(doc, 9, 'normal', MUTED);
      doc.text(how[p], cols3[1], y); doc.text(base[p], cols3[2], y);
      set(doc, 9.5, 'bold', INK);
      doc.text(F.eurPdf(r.pools[p]), cols3[3], y, { align: 'right' });
    }
    y += 1.5; hr(doc, L, y, R, INK, 0.5);
    line(`За разпределяне между ${r.payers} обекта`, r.totalPool, true);
    if (m.note) {
      need(12); y += 8;
      set(doc, 9, 'normal', MUTED);
      const t = doc.splitTextToSize('Бележка: ' + m.note, R - L);
      need(t.length * 4.5); doc.text(t, L, y); y += t.length * 4.5;
    }

    section('4. Сметки по обекти');
    const cols = [L, L + 50, L + 78, L + 103, L + 124, L + 150, R];
    const header = () => {
      y += 6;
      set(doc, 7.5, 'bold', MUTED);
      doc.text('Обект', cols[0], y);
      ['Ид. част %', 'Постоянни', 'Вода', 'Ток общи', 'Чилъри', 'Общо €'].forEach((h, i) => doc.text(h, cols[i + 1], y, { align: 'right' }));
      y += 1.6; hr(doc, L, y, R);
    };
    need(14); header();
    for (const row of r.rows) {
      if (need(5)) header();
      y += 4.6;
      set(doc, 8, row.total ? 'normal' : 'normal', row.total ? INK : MUTED);
      doc.text(String(row.id), cols[0], y);
      doc.text(F.pct(row.share), cols[1], y, { align: 'right' });
      C.PARTS.forEach((p, i) => doc.text(F.dash(row.parts[p]).replace(/ /g, ' '), cols[i + 2], y, { align: 'right' }));
      set(doc, 8, 'bold', row.total ? INK : MUTED);
      doc.text(F.dash(row.total).replace(/ /g, ' '), cols[6], y, { align: 'right' });
    }
    need(8); y += 2; hr(doc, L, y, R, INK, 0.5); y += 5;
    set(doc, 8.5, 'bold', INK);
    doc.text(`Общо (${r.rows.length})`, cols[0], y);
    doc.text(F.pct(r.rows.reduce((s, x) => s + x.share, 0)), cols[1], y, { align: 'right' });
    C.PARTS.forEach((p, i) => doc.text(F.n2(r.rows.reduce((s, x) => s + x.parts[p], 0), 2, ' '), cols[i + 2], y, { align: 'right' }));
    doc.text(F.n2(r.rows.reduce((s, x) => s + x.total, 0), 2, ' '), cols[6], y, { align: 'right' });

    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      set(doc, 7, 'normal', MUTED);
      doc.text(`ТАЦ „Гранд“ · Справка за ${F.monthName(ctx.monthId)} · всички суми са в евро`, L, H - 9);
      doc.text(`стр. ${i} от ${pages}`, R, H - 9, { align: 'right' });
    }
    return doc.output('blob');
  }

  window.GrandPDF = { slip, allSlips, zip, report };
})();

<script>
// Excel: експорт на месец и обекти, импорт на списъка с обекти
(function (root) {
  const KIND_BG = { unit: 'обект', terrace: 'тераса', garage: 'гараж', hypermarket: 'хипермаркет' };
  const KIND_FROM = { 'обект': 'unit', 'тераса': 'terrace', 'гараж': 'garage', 'хипермаркет': 'hypermarket' };
  const PARTS = ['fixed', 'water', 'power', 'chillers'];
  const PART_HEAD = { fixed: 'Постоянни', water: 'Вода', power: 'Ток общи', chillers: 'Чилъри' };
  const yes = (v) => /^(да|1|true|x|✓)$/i.test(String(v == null ? '' : v).trim());
  const r2 = (v) => Math.round((Number(v) || 0) * 100) / 100;

  const lib = () => root.XLSX;
  const load = () => (root.GrandLibs ? root.GrandLibs.load('xlsx') : Promise.resolve());

  function toBlob(wb) {
    const out = lib().write(wb, { bookType: 'xlsx', type: 'array' });
    return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  async function exportMonth(ctx) {
    await load();
    const X = lib(), C = root.GrandCalc, F = root.GrandFmt;
    const r = ctx.result, m = ctx.month;
    const head = ['Обект', 'Идеална част %', 'Вид', 'Етаж', 'Постоянни €', 'Вода €', 'Ток общи €', 'Чилъри €', 'Общо €'];
    const rows = r.rows.map((x) => [x.id, x.share, KIND_BG[x.kind] || x.kind, x.floor == null ? '' : x.floor,
      r2(x.parts.fixed), r2(x.parts.water), r2(x.parts.power), r2(x.parts.chillers), r2(x.total)]);
    const n = rows.length;
    rows.push(['ОБЩО', { f: `SUM(B2:B${n + 1})` }, '', '',
      { f: `SUM(E2:E${n + 1})` }, { f: `SUM(F2:F${n + 1})` }, { f: `SUM(G2:G${n + 1})` }, { f: `SUM(H2:H${n + 1})` }, { f: `SUM(I2:I${n + 1})` }]);
    const ws = X.utils.aoa_to_sheet([head, ...rows]);
    ws['!cols'] = [{ wch: 18 }, { wch: 13 }, { wch: 12 }, { wch: 6 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 }];
    ws['!autofilter'] = { ref: `A1:I${n + 1}` };

    const S = [
      [`ТАЦ „Гранд“ — справка за ${F.monthName(ctx.monthId)}`],
      [ctx.locked ? 'Заключен месец' : 'Чернова'],
      [],
      ['Разходи', 'Сума €'],
      ...(m.fixedItems || []).filter((it) => Number(it.amount)).map((it) => ['  ' + it.name, r2(it.amount)]),
      ['Постоянни текущи разходи — общо', r2(C.sumItems(m.fixedItems))],
      ['Вода за общите части', r2(m.water)],
      ['Електроенергия за общите части', r2(m.power)],
      ['Електроенергия за чилърите', r2(m.chillers)],
      [],
      ['Приходи', 'Сума €'],
      ...(m.revenueItems || []).filter((it) => Number(it.amount)).map((it) => ['  ' + it.name, r2(it.amount)]),
      ['Приходи — общо', r2(C.sumItems(m.revenueItems))],
      ['Приспаднати (чл. 10)', r2(r.deducted)],
      [],
      ['Разпределение', 'Сума €', 'База'],
      ['Постоянни (поравно)', r2(r.pools.fixed), `${r.bases.fixed} обекта`],
      ['Вода (поравно)', r2(r.pools.water), `${r.bases.water} обекта`],
      ['Ток общи (ид. части)', r2(r.pools.power), `${r.bases.power}%`],
      ['Чилъри (ид. части)', r2(r.pools.chillers), `${r.bases.chillers}%`],
      ['За разпределяне', r2(r.totalPool), `${r.payers} обекта`],
    ];
    if (m.note) S.push([], ['Бележка', m.note]);
    const ws2 = X.utils.aoa_to_sheet(S);
    ws2['!cols'] = [{ wch: 38 }, { wch: 14 }, { wch: 16 }];

    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws2, 'Справка');
    X.utils.book_append_sheet(wb, ws, 'Сметки');
    return toBlob(wb);
  }

  async function exportObjects(objects) {
    await load();
    const X = lib();
    const head = ['Обект', 'Идеална част %', 'Вид', 'Етаж', ...PARTS.map((p) => PART_HEAD[p]), 'Бележка'];
    const rows = objects.map((o) => [o.id, o.share, KIND_BG[o.kind] || o.kind, o.floor == null ? '' : o.floor,
      ...PARTS.map((p) => (o[p] ? 'да' : 'не')), o.note || '']);
    const ws = X.utils.aoa_to_sheet([head, ...rows]);
    ws['!cols'] = [{ wch: 18 }, { wch: 13 }, { wch: 12 }, { wch: 6 }, { wch: 10 }, { wch: 8 }, { wch: 9 }, { wch: 8 }, { wch: 30 }];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Обекти');
    return toBlob(wb);
  }

  // Чете Excel със списък на обекти. Търси ред със заглавия „обект“ и „част“.
  // Ако има колони Вид/Етаж/Постоянни/Вода/Ток общи/Чилъри/Бележка, взима и тях.
  function parseObjectsWorkbook(wb) {
    const X = lib();
    for (const name of wb.SheetNames) {
      const aoa = X.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null });
      const norm = (v) => String(v == null ? '' : v).toLowerCase().replace(/\s+/g, ' ').trim();
      const hi = aoa.findIndex((row) => row && row.some((c) => /обект/.test(norm(c))) && row.some((c) => /част/.test(norm(c))));
      if (hi < 0) continue;
      const H = aoa[hi].map(norm);
      const col = (re) => H.findIndex((h) => re.test(h));
      const ci = {
        id: col(/обект/), share: col(/част/), kind: col(/^вид/), floor: col(/^етаж/),
        fixed: col(/^постоянни/), water: col(/^вода/), power: col(/^ток общи/), chillers: col(/^чил/), note: col(/^бележка/),
      };
      const out = [], skipped = [];
      for (let i = hi + 1; i < aoa.length; i++) {
        const row = aoa[i] || [];
        const id = row[ci.id] == null ? '' : String(row[ci.id]).trim();
        const rawShare = row[ci.share];
        if (!id && (rawShare == null || rawShare === '')) continue;
        const share = typeof rawShare === 'number' ? rawShare : Number(String(rawShare || '').replace(',', '.'));
        if (!id || /^общо$/i.test(id) || !Number.isFinite(share)) { skipped.push(i + 1); continue; }
        const o = { id, share };
        if (ci.kind >= 0 && KIND_FROM[norm(row[ci.kind])]) o.kind = KIND_FROM[norm(row[ci.kind])];
        if (ci.floor >= 0) { const f = row[ci.floor]; o.floor = f === null || f === '' || isNaN(Number(f)) ? null : Number(f); }
        for (const p of PARTS) if (ci[p] >= 0) o[p] = yes(row[ci[p]]);
        if (ci.note >= 0) o.note = row[ci.note] == null ? '' : String(row[ci.note]);
        out.push(o);
      }
      if (out.length) return { sheet: name, rows: out, skipped, hasFlags: ci.fixed >= 0 };
    }
    throw new Error('Не намерих колони „обект“ и „идеална част“ в този файл.');
  }

  async function parseObjectsFile(file) {
    await load();
    const buf = await file.arrayBuffer();
    return parseObjectsWorkbook(lib().read(buf, { type: 'array' }));
  }

  // Сравнява внесения списък с текущия
  function diffObjects(current, incoming) {
    const cur = new Map(current.map((o) => [o.id, o]));
    const inc = new Map(incoming.map((o) => [o.id, o]));
    const changed = [], added = [], missing = [];
    for (const o of incoming) {
      const c = cur.get(o.id);
      if (!c) added.push(o);
      else if (Math.abs(c.share - o.share) > 1e-9 || PARTS.some((p) => p in o && !!o[p] !== !!c[p]) || ('kind' in o && o.kind !== c.kind)) changed.push({ from: c, to: o });
    }
    for (const c of current) if (!inc.has(c.id)) missing.push(c);
    return { changed, added, missing };
  }

  // Прилага внесения списък: пази отметките на познатите обекти, новите получават правилата по подразбиране
  function applyImport(current, incoming, removeMissing) {
    const cur = new Map(current.map((o) => [o.id, o]));
    const defaults = (o) => {
      const m = /^([1-4])-/.exec(o.id);
      const kind = o.kind || (/тераса/i.test(o.id) ? 'terrace' : 'unit');
      const floor = 'floor' in o ? o.floor : m ? Number(m[1]) : null;
      return {
        kind, floor,
        fixed: kind !== 'terrace', water: !['terrace', 'garage', 'hypermarket'].includes(kind),
        power: kind !== 'terrace', chillers: kind === 'unit' && [1, 2, 3].includes(floor),
        note: 'нов обект — провери отметките',
      };
    };
    const result = incoming.map((o) => ({ ...(cur.get(o.id) || { id: o.id, ...defaults(o) }), ...o }));
    if (!removeMissing) {
      const inc = new Set(incoming.map((o) => o.id));
      current.forEach((c) => { if (!inc.has(c.id)) result.push(c); });
    }
    return result;
  }

  const api = { exportMonth, exportObjects, parseObjectsFile, parseObjectsWorkbook, diffObjects, applyImport };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.GrandExcel = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  const F = window.GrandFmt, C = window.GrandCalc, S = window.GrandStore, E = window.GrandExcel, P = window.GrandPDF;
  const esc = F.esc;
  const app = document.getElementById('app');

  const KIND = { unit: 'обект', terrace: 'тераса', garage: 'гараж', hypermarket: 'хипермаркет' };
  const PART_SHORT = { fixed: 'Постоянни', water: 'Вода', power: 'Ток общи', chillers: 'Чилъри' };
  const DEFAULT_FIXED = [
    'Наем и разходи за трафопост', 'Охрана — физическа и техническа', 'Почистване', 'Поддръжка на асансьори и ескалатори',
    'Видеонаблюдение, интернет и комуникации', 'Дезинсекция и дератизация', 'Противопожарни системи',
    'Възнаграждение на управителя', 'Юридическо и счетоводно обслужване', 'Заплати и осигуровки', 'Банкови такси',
    'Административни услуги', 'Консумативи и материали',
  ];
  const DEFAULT_REVENUE = ['Рекламни площи', 'LED екран', 'Санитарни помещения', 'Автомати'];
  const REASONS = ['Решение на Общото събрание', 'Несъбираемост на вземания', 'Просрочени задължения към доставчици'];

  const state = {
    me: null, objects: null, months: [],
    view: 'dashboard', monthId: null,
    month: null, monthStatus: null, saveState: '', saveTimer: null, saving: null, saveAgain: false,
    rowsQ: '', rowsFloor: 'all', confirm: null, busy: {},
    objDraft: null, objDirty: false, objQ: '', objKind: 'all', importInfo: null,
    historyObj: '',
  };

  // ---------- помощни ----------
  const clone = (x) => JSON.parse(JSON.stringify(x));
  let toastTimer = null;
  function toast(msg, kind = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + kind;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, kind === 'bad' ? 7000 : 3500);
  }
  const canEdit = () => !!(state.me && state.me.canEdit);
  const pill = (status) => status === 'locked'
    ? '<span class="pill pill--locked">Заключен</span>'
    : '<span class="pill pill--draft">Чернова</span>';

  function resultFor(m) {
    if (m.status === 'locked' && m.snapshot) return C.fromSnapshot(m.snapshot);
    return C.calculate(state.objects || [], C.monthInput(m));
  }
  function ctxFor(m) {
    return { monthId: m.id, month: m, result: resultFor(m), locked: m.status === 'locked' };
  }

  async function download(name, makeBlob, key) {
    if (state.busy[key]) return;
    state.busy[key] = true;
    renderBusy();
    try {
      const blob = await makeBlob();
      const ok = await S.download(name, blob);
      if (ok) toast('Файлът е готов: ' + name, 'ok');
    } catch (e) {
      toast(e.message || 'Файлът не можа да се направи.', 'bad');
    } finally {
      state.busy[key] = false;
      renderBusy();
    }
  }
  function renderBusy() {
    document.querySelectorAll('[data-busy]').forEach((b) => {
      const on = !!state.busy[b.dataset.busy];
      b.disabled = on;
      b.classList.toggle('is-busy', on);
    });
  }

  // ---------- навигация ----------
  // Навигацията пази текущия екран в паметта; адресът (#months и т.н.) се обновява, когато е възможно
  let current = (location.hash || '').replace(/^#/, '');
  function parseHash() {
    const h = current;
    const m = /^month-(\d{4}-\d{2})$/.exec(h);
    if (m) return { view: 'month', monthId: m[1] };
    if (['dashboard', 'months', 'objects', 'settings'].includes(h)) return { view: h };
    return { view: 'dashboard' };
  }
  function go(token) {
    current = token;
    try { if (location.hash.replace(/^#/, '') !== token) history.pushState(null, '', '#' + token); } catch { /* адресът не може да се смени тук */ }
    route();
  }
  async function route() {
    await flushMonth();
    if (state.view === 'objects' && state.objDirty) {
      toast('Промените по обектите не са запазени — върни се в „Обекти“ и натисни „Запази“.', 'bad');

    const r = parseHash();
    state.view = r.view;
    state.confirm = null;
    if (r.view === 'month') await openMonth(r.monthId);
    else render();
    window.scrollTo(0, 0);
  }

  // ---------- табло ----------
  function chartSVG(items) {
    if (!items.length) return '';
    const W = 640, H = 240, padL = 56, padB = 28, padT = 12, padR = 8;
    const max = Math.max(...items.map((x) => x.total), 1);
    const step = niceStep(max);
    const top = Math.ceil(max / step) * step;
    const y = (v) => padT + (H - padT - padB) * (1 - v / top);
    const bw = Math.min(46, ((W - padL - padR) / items.length) * 0.6);
    const gap = (W - padL - padR) / items.length;
    let g = '';
    for (let v = 0; v <= top + 1e-9; v += step) {
      g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" class="grid"/>`;
      g += `<text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end" class="tick">${F.n2(v, 0)}</text>`;
    }
    items.forEach((it, i) => {
      const x = padL + gap * i + (gap - bw) / 2;
      let acc = 0;
      C.PARTS.forEach((p) => {
        const v = Math.max(it.parts[p], 0);
        if (!v) return;
        const y1 = y(acc + v), y0 = y(acc);
        g += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(y0 - y1, 0.5).toFixed(1)}" class="s-${p}${it.status === 'draft' ? ' is-draft' : ''}"><title>${esc(F.monthTitle(it.id))} · ${PART_SHORT[p]}: ${F.eur(v)}</title></rect>`;
        acc += v;
      });
      g += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="tick">${esc(F.MONTHS[Number(it.id.slice(5)) - 1].slice(0, 3))} ${it.id.slice(2, 4)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Разходи по месеци">${g}</svg>`;
  }
  function niceStep(max) {
    const raw = max / 4;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }

          <div class="chart-wrap">${chartSVG(data.slice(-12))}</div>

      : `<section class="card empty">

    shell(`${kpis}<div class="dash-grid">${chart}${list}</div>`, { hero });

  async function createMonth(id, copy) {
    if (state.months.some((m) => m.id === id)) throw new Error(`${F.monthTitle(id)} вече съществува.`);
    let data = {
      fixedItems: DEFAULT_FIXED.map((name) => ({ name, amount: 0 })),
      water: 0, power: 0, chillers: 0,
      revenueItems: DEFAULT_REVENUE.map((name) => ({ name, amount: 0 })),
      deductMode: 'full', deductPct: 100, deductReason: '', note: '',
    };
    if (copy) {
      const src = [...state.months].sort((a, b) => b.id.localeCompare(a.id))[0];
      if (src) data = { ...clone(src), note: '' };
      delete data.snapshot; delete data.status; delete data.lockedAt; delete data.updatedAt; delete data.id;
    }
    const saved = await S.saveMonth(id, data);
    state.months = [...state.months.filter((m) => m.id !== id), { ...saved, id }];
    return saved;
  }

  // ---------- месец ----------
  async function openMonth(id) {
    if (!state.objects) { shell(noObjects()); return; }

        <a class="btn btn--ghost" href="#dashboard">Към таблото</a></section>`);
      return;
    }
    state.monthId = id;
    state.month = clone(m);
    state.month.fixedItems = state.month.fixedItems || [];
    state.month.revenueItems = state.month.revenueItems || [];
    state.saveState = '';
    state.rowsQ = '';
